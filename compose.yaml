name: cdc-2022-validation
services:
  postgres:
    image: postgres:13.5
    mem_limit: 256m
    environment:
      POSTGRES_USER: lab
      POSTGRES_DB: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run init-env first}
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=8, -c, max_wal_senders=8]
    ports: ["127.0.0.1:4701:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 30
  zookeeper:
    image: debezium/zookeeper:1.8.0.Final
    platform: linux/amd64
    mem_limit: 256m
    environment:
      SERVER_ID: 1
      HEAP_OPTS: -Xms64m -Xmx128m
    volumes: [zookeeper-data:/zookeeper/data, zookeeper-log:/zookeeper/txns]
  kafka:
    image: debezium/kafka:1.8.0.Final
    platform: linux/amd64
    mem_limit: 640m
    depends_on: [zookeeper]
    environment:
      ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:4702
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:4702
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    ports: ["127.0.0.1:4702:4702"]
    volumes: [kafka-data:/kafka/data]

  connect:
    image: debezium/connect:1.8.0.Final
    platform: linux/amd64
    mem_limit: 768m
    depends_on: [postgres, kafka]
    ports: ["127.0.0.1:4703:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc-lab-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms128m -Xmx384m
      KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
      VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'

  jobmanager:
    image: flink:1.14.2-scala_2.12-java11
    platform: linux/amd64
    user: "0:0"
    mem_limit: 768m
    command: jobmanager
    ports: ["127.0.0.1:4704:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 600m
        taskmanager.memory.process.size: 1024m
        parallelism.default: 1
        execution.checkpointing.interval: 5s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.checkpoints.dir: file:///state/checkpoints
        state.savepoints.dir: file:///state/savepoints
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 20
        restart-strategy.fixed-delay.delay: 3s
    volumes:
      - flink-state:/state
      - ./infra/flink/lib/flink-sql-connector-kafka_2.12-1.14.2.jar:/opt/flink/lib/flink-sql-connector-kafka_2.12-1.14.2.jar:ro
      - ./infra/flink/lib/flink-connector-jdbc_2.12-1.14.2.jar:/opt/flink/lib/flink-connector-jdbc_2.12-1.14.2.jar:ro
      - ./infra/flink/lib/postgresql-42.3.1.jar:/opt/flink/lib/postgresql-42.3.1.jar:ro
      - ./.runtime:/runtime:ro
  taskmanager:
    image: flink:1.14.2-scala_2.12-java11
    platform: linux/amd64
    user: "0:0"
    mem_limit: 1200m
    command: taskmanager
    depends_on: [jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
        state.checkpoints.dir: file:///state/checkpoints
        state.savepoints.dir: file:///state/savepoints
    volumes:
      - flink-state:/state
      - ./infra/flink/lib/flink-sql-connector-kafka_2.12-1.14.2.jar:/opt/flink/lib/flink-sql-connector-kafka_2.12-1.14.2.jar:ro
      - ./infra/flink/lib/flink-connector-jdbc_2.12-1.14.2.jar:/opt/flink/lib/flink-connector-jdbc_2.12-1.14.2.jar:ro
      - ./infra/flink/lib/postgresql-42.3.1.jar:/opt/flink/lib/postgresql-42.3.1.jar:ro

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  flink-state:
