name: CDC actual runtime acceptance
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m cdc_lab.cli init-env
      - run: python scripts/fetch_jars.py
      - run: python -m cdc_lab.cli start
      - run: python scripts/integration.py
      - name: Measure source-to-serving convergence
        shell: bash
        run: python -m cdc_lab.cli benchmark --count 100 --rounds 3 | tee artifacts/benchmark.json
      - name: Preserve completed and failed scenario evidence in the job log
        if: always()
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          for report in sorted(Path('artifacts').glob('run-*.json')):
              print(report.name)
              print(report.read_text())
          PYTHON
      - run: docker compose stop
        if: always()
