name: CDC actual runtime acceptance
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m cdc_lab.cli init-env
      - run: python scripts/fetch_jars.py
      - run: python -m cdc_lab.cli start
      - run: python scripts/integration.py
      - run: python -m cdc_lab.cli benchmark --count 100 --rounds 3 > artifacts/benchmark.json
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: cdc-acceptance
          path: artifacts/
      - run: docker compose stop
        if: always()
